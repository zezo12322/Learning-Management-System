name: Deploy Web

# Every push to `development` that touches the web app deploys it, so the
# `optima-lms-web` Worker always matches the branch. Before this, the app shipped
# by someone running `npm run deploy` from their laptop — which is why every
# version in the Cloudflare dashboard reads "Manually deployed", and why the
# NEXT_PUBLIC_* values baked into the bundle differed per person.
#
# The dispatch trigger stays for deploying a different ref (a tag, a hotfix
# branch) and for re-running a deploy without an empty commit.
#
# `development` and not `main`: it is the branch the app is released from, and
# the one the release mirror syncs. Correctness still comes from CI, which runs
# on every pull request — a direct push to `development` deploys unreviewed.
#
# Backend deploys are NOT here on purpose: Railway already deploys from `main`,
# and adding a second path would double-deploy.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: false
        default: main
  push:
    branches: [main]
    # dataconnect/ is here because the build generates the Data Connect SDKs the
    # bundle imports; a schema change alone can change what ships.
    paths:
      - 'web/**'
      - 'dataconnect/**'
      - '.github/workflows/deploy-web.yml'
      - '.github/actions/setup-node-package/**'

concurrency:
  # Never two web deploys at once, and do not cancel one midway.
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Attach required reviewers to this GitHub Environment to get a manual
    # approval gate, and scope the deploy secrets to it (KAN-147). Until the
    # environment exists this simply runs unprotected.
    environment: production
    defaults:
      run:
        working-directory: web
    env:
      # On dispatch this is whatever ref was asked for. On push it is the exact
      # commit that triggered the run, not the branch name — two pushes in quick
      # succession would otherwise both build the newer one.
      DEPLOY_REF: ${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-node-package
        with:
          package: web

      # Runs before SDK generation so a misconfigured repository is reported in
      # seconds, not after a minute of downloading firebase-tools.
      #
      # These checks matter more now that a merge deploys on its own: NEXT_PUBLIC_*
      # values are inlined at build time, so an unset one does not fail the build —
      # it ships a bundle that cannot reach Firebase or the API, and the only
      # symptom is a broken app. Better to stop here and say which one.
      #
      # Each NEXT_PUBLIC_* is read as `vars.X || secrets.X`. None of them are
      # secret — they are inlined into a bundle any visitor can read — so
      # Variables is the natural home, but storing them as Actions secrets is a
      # reasonable reflex and works identically at build time. Accepting both
      # means a deploy is never blocked by which of the two tabs someone used.
      - name: Verify deploy credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          missing=""
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            NEXT_PUBLIC_API_URL \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID
          do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing — add each under Settings → Secrets and variables → Actions. The CLOUDFLARE_* ones must be secrets; every NEXT_PUBLIC_* is read from either tab, so put them wherever you prefer. See docs/OPERATIONS.md."
            exit 1
          fi
          echo "Cloudflare credentials and build-time config present."

      # FIREBASE_TOKEN is deliberately not in the check above: SDK generation
      # reads the committed dataconnect/ schema and succeeds without it (run
      # 31327854843 generated all four SDKs with the token unset). Requiring it
      # would fail deploys over a credential the step does not use.
      - name: Generate Data Connect SDKs
        run: npx firebase-tools dataconnect:sdk:generate
        working-directory: ${{ github.workspace }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # NEXT_PUBLIC_* values are inlined at build time, so they must be present
      # here rather than at runtime. Anything unset falls back to the app's own
      # guard (which logs loudly in production) instead of silently shipping a
      # localhost URL.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_AI_ENABLED: ${{ vars.NEXT_PUBLIC_AI_ENABLED }}
          NEXT_PUBLIC_AI_API_URL: ${{ vars.NEXT_PUBLIC_AI_API_URL }}
          NEXT_PUBLIC_AI_PROVIDER: ${{ vars.NEXT_PUBLIC_AI_PROVIDER }}
          NEXT_PUBLIC_DEFAULT_CATEGORY_ID: ${{ vars.NEXT_PUBLIC_DEFAULT_CATEGORY_ID }}
        run: npm run deploy

      - name: Post-deploy health check
        if: vars.WEB_HEALTH_URL != ''
        run: |
          echo "Checking ${{ vars.WEB_HEALTH_URL }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "${{ vars.WEB_HEALTH_URL }}" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy (HTTP 200)."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code — retrying in 10s"
            sleep 10
          done
          echo "::error::Web deploy did not become healthy. See docs/OPERATIONS.md §3 for rollback."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Web deploy"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Ref | \`$DEPLOY_REF\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo
            echo "Rollback: \`npx wrangler rollback\` — see \`docs/OPERATIONS.md\` §3."
          } >> "$GITHUB_STEP_SUMMARY"
