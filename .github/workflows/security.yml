name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly sweep so newly-disclosed advisories surface without a push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking on the first pass: the scanner has never run against this
    # history, so an unknown backlog of findings must not block merges before
    # anyone has triaged it. Flip to blocking once a clean run is confirmed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers past commits, not just the tip.
          fetch-depth: 0

      # Run the gitleaks image directly rather than the marketplace action: the
      # action requires a paid licence key for organization accounts, the image
      # does not.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose \
            --report-format=sarif --report-path=/repo/gitleaks.sarif

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 14
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    # Reviews only what the PR adds, so it flags newly-introduced vulnerable
    # packages without failing on the existing backlog. Requires the dependency
    # graph, which needs Advanced Security on private repos — skip there rather
    # than fail.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, web, functions]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Blocking threshold is `critical` only. Measured baseline at the time this
      # was added: 0 critical, but 25-28 high per package (mostly transitive dev
      # tooling). Gating on `high` would fail every PR immediately on debt it did
      # not introduce; gating on `critical` passes today and still stops a
      # genuinely severe dependency from landing. Raise this to `high` once
      # Dependabot has worked the backlog down.
      - name: Audit (fail on critical)
        run: npm audit --audit-level=critical

      - name: Report full advisory counts
        if: always()
        run: |
          {
            echo "### ${{ matrix.package }} — npm audit"
            echo
            npm audit --json 2>/dev/null | node -e '
              let raw = "";
              process.stdin.on("data", d => raw += d);
              process.stdin.on("end", () => {
                let v = {};
                try { v = JSON.parse(raw).metadata.vulnerabilities || {}; } catch {}
                console.log("| Severity | Count |");
                console.log("|---|---|");
                for (const k of ["critical", "high", "moderate", "low", "info"]) {
                  console.log(`| ${k} | ${v[k] ?? 0} |`);
                }
              });
            ' || echo "_audit report unavailable_"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security
    if: always()
    needs: [secrets, dependency-review, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a blocking check failed
        # `secrets` is continue-on-error and `dependency-review` is skipped on
        # private repos, so neither can fail this gate; `audit` can.
        if: needs.audit.result == 'failure' || needs.audit.result == 'cancelled'
        run: |
          echo "::error::Dependency audit failed."
          exit 1

      - run: echo "Security checks complete."
