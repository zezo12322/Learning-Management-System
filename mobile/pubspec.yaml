name: optimatech_lms
description: OptimaTech LMS - Learning Management System Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Core
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  dartz:  ^0.10.1
  logger: ^2.6.0
  # Networking
  dio: ^5.11.0
  retrofit: 4.1.0
  pretty_dio_logger: ^1.4.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  firebase_analytics: ^12.0.0
  google_sign_in: ^6.2.1
  video_player: ^2.11.1
  chewie: ^1.13.1
  # Local Storage & Cache
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  # security
  flutter_secure_storage: ^10.3.1
  # Real-time / WebSocket
  web_socket_channel: ^2.4.0
  socket_io_client: ^3.1.5
  # UI & Responsive
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1 # For consistent spacing between widgets (same SizedBox). See https://pub.dev/packages/gap
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  skeletonizer: ^2.1.3
  lottie: ^3.3.3
  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.2
  # Utilities
  collection: ^1.19.1 # Provides additional collection types and utilities, such as groupBy, partition, and more.
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.3
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.0
  animate_icons: ^2.0.0
  shimmer: ^3.0.0
  firebase_data_connect: 0.3.0+1
  firebase_app_check: 0.4.4
  uuid: ^4.6.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  retrofit_generator: 8.0.1
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  flutter_intl:
    enabled: true

dependency_overrides:
  web_socket_channel: ^3.0.1
  archive: ^4.0.0
  firebase_core: 4.11.0
  firebase_auth: 6.5.4
  cloud_firestore: 6.6.0
  firebase_storage: 13.4.3
  firebase_messaging: 16.4.1
  firebase_analytics: 12.4.3
  google_sign_in: 6.2.1