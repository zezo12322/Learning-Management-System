name: optimatech_lms
description: OptimaTech LMS - Learning Management System Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Core
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  dartz:  ^0.10.1
  # Networking
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.2
  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  firebase_analytics: ^12.4.2
  # Local Storage & Cache
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  # security
  flutter_secure_storage: ^10.3.1
  # Real-time / WebSocket
  web_socket_channel: ^3.0.3
  socket_io_client: ^3.1.5
  # UI & Responsive
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1 # For consistent spacing between widgets (same SizedBox). See https://pub.dev/packages/gap
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  skeletonizer: ^2.1.3
  lottie: ^3.3.3
  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.2
  # Utilities
  collection: ^1.19.1 # Provides additional collection types and utilities, such as groupBy, partition, and more.
  connectivity_plus: ^7.1.1
  permission_handler: ^12.0.3
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
