org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable the File System Watcher to prevent background file locking
org.gradle.vfs.watch=false

# Disable the Gradle build cache to avoid complex file "move" operations
org.gradle.caching=false

# Disable the Android-specific build cache
android.enableBuildCache=false

# Disable Kotlin incremental compilation to avoid cross-drive (C: vs D:) errors
kotlin.incremental=false

# Force Gradle to run in a single process (Slower but avoids locking)
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=1
