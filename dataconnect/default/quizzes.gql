# Fetches all questions and their options for a particular quiz lecture
query GetQuizQuestions($lectureId: UUID!) @auth(level: USER) {
  courseQuizs(where: { lectureId: { eq: $lectureId } }) {
    id
    passingScore
    maxAttempts
    quizQuestions_on_quiz(orderBy: [{ order: ASC }]) {
      id
      questionText
      points
      quizOptions_on_question(orderBy: [{ order: ASC }]) {
        id
        text
      }
    }
  }
}

# Initializes a new attempt for taking a quiz
mutation StartQuizAttempt($quizId: UUID!) @auth(level: USER) {
  quizAttempt_insert(
    data: { userId_expr: "auth.uid", quizId: $quizId }
  )
}

# Logs an answer to a specific quiz question during an active attempt
mutation SubmitQuizAnswer(
  $attemptId: UUID!, 
  $questionId: UUID!, 
  $optionId: UUID! 
) @auth(level: USER) {
  quizAttemptAnswer_insert(
    data: {
      attemptId: $attemptId,
      questionId: $questionId,
      selectedOptionId: $optionId
    }
  )
}

# Marks a quiz attempt as finished with final score and passed status
mutation FinishQuizAttempt($attemptId: UUID!, $score: Float!, $passed: Boolean!) @auth(level: USER) {
  quizAttempt_update(
    id: $attemptId,
    data: {
      score: $score,
      passed: $passed,
      completedAt_expr: "request.time"
    }
  )
}