# ==========================================
# COURSE RATINGS
# ==========================================

# Create-or-update the current user's rating for a course. The composite key
# (user, course) on CourseRating makes this idempotent: re-rating overwrites the
# previous value instead of inserting a duplicate. createdAt keeps its original
# value on update (upsert only writes the supplied fields); updatedAt is bumped.
# RBAC hardening: NO_ACCESS. RatingsService gates rating on enrollment + course
# state and recomputes the denormalised aggregate after each write; a USER-level
# version let a client rate a course it never enrolled in and desync avgRating/
# ratingCount by skipping the recompute. Backend-only now; the rater is passed
# explicitly as $userId.
mutation UpsertCourseRating($courseId: UUID!, $rating: Int!, $review: String, $userId: String!) @auth(level: NO_ACCESS) {
  courseRating_upsert(
    data: {
      userId: $userId
      courseId: $courseId
      rating: $rating
      review: $review
      updatedAt_expr: "request.time"
    }
  )
}

# Remove the current user's own rating. Scoped to auth.uid so a user can only
# ever delete their own row, regardless of the courseId supplied.
# NO_ACCESS (see UpsertCourseRating): backend-only so the aggregate recompute is
# never skipped. Owner passed explicitly; still scoped to the caller's own row.
mutation DeleteCourseRating($courseId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  courseRating_deleteMany(
    where: { userId: { eq: $userId }, courseId: { eq: $courseId } }
  )
}

# The current user's rating for a course (null if they haven't rated it).
query GetMyCourseRating($courseId: UUID!) @auth(level: USER) {
  courseRatings(
    where: { userId: { eq_expr: "auth.uid" }, courseId: { eq: $courseId } }
  ) {
    rating
    review
    createdAt
    updatedAt
  }
}

# Public, paginated list of reviews shown on a course page ("View All"). Reviewer
# name/avatar are exposed deliberately, the same way ListPublishedCourses exposes
# the author's name. $limit/$offset drive paging; the service clamps them.
query ListCourseRatings($courseId: UUID!, $limit: Int, $offset: Int) @auth(level: PUBLIC, insecureReason: "Course reviews are public, like the course listing itself.") {
  courseRatings(
    where: { courseId: { eq: $courseId } }
    orderBy: [{ updatedAt: DESC }]
    limit: $limit
    offset: $offset
  ) {
    rating
    review
    createdAt
    updatedAt
    user {
      name
      avatar
    }
  }
}

# Lightweight projection (rating value only) used to compute the average / count
# / star distribution in the service layer, mirroring how course completion is
# derived on-read from GetCourseCompletionStatus. Also drives the denormalised
# aggregate recompute after each rating write.
query GetCourseRatingsForSummary($courseId: UUID!) @auth(level: PUBLIC, insecureReason: "Aggregate rating stats are public course metadata.") {
  courseRatings(where: { courseId: { eq: $courseId } }) {
    rating
  }
}

# Writes the denormalised rating aggregate back onto the Course row. Runs with
# NO_ACCESS: only the backend service account may set it (via executeMutationAsAdmin),
# never an end user directly — otherwise a client could spoof a course's score.
# Mirrored (without @auth) in ADMIN_OPERATIONS for the :executeGraphql admin path.
mutation AdminUpdateCourseRatingAggregate($courseId: UUID!, $avgRating: Float!, $ratingCount: Int!) @auth(level: NO_ACCESS) {
  course_update(id: $courseId, data: { avgRating: $avgRating, ratingCount: $ratingCount })
}
