# ==========================================
# STUDENT — MISSION SUBMISSIONS
# ==========================================

query GetMissionForEnrollment($missionId: UUID!) @auth(level: USER) {
  mission(id: $missionId) { id deletedAt }
}

mutation SubmitMission($missionId: UUID!, $fileUrl: String!) @auth(level: USER) {
  missionSubmission_insert(data: { missionId: $missionId, studentId_expr: "auth.uid", fileUrl: $fileUrl, status: PENDING })
}

query MySubmissions @auth(level: USER) {
  missionSubmissions(where: { studentId: { eq_expr: "auth.uid" } }, orderBy: [{ updatedAt: DESC }]) {
    id fileUrl status feedback submittedAt missionSubmissionScores_on_submission { score criterion { criterionName maxPoints } } mission { title difficulty }
  }
}

# ==========================================
# INSTRUCTOR — GRADING
# ==========================================

mutation GradeSubmission($submissionId: UUID!, $feedback: String) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionSubmission_update(id: $submissionId, data: { graderId_expr: "auth.uid", status: GRADED, feedback: $feedback, updatedAt_expr: "request.time" })
}

mutation AddCriterionScore($submissionId: UUID!, $criterionId: UUID!, $score: Float!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionSubmissionScore_upsert(data: { submissionId: $submissionId, criterionId: $criterionId, score: $score })
}

query GetSubmissionForGrading($submissionId: UUID!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionSubmission(id: $submissionId) { id status attemptNumber mission { id } student { id } }
}

query GetEnrollmentForUserMission($userId: String!, $missionId: UUID!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  enrollments(where: { userId: { eq: $userId }, missionId: { eq: $missionId }, targetType: { eq: MISSION } }) { id status completedAt }
}

# ==========================================
# ADMIN / INSTRUCTOR — MISSION MANAGEMENT
# ==========================================

mutation AdminCreateMission($title: String!, $scenarioDescription: String!, $durationMinutes: Int!, $categoryId: UUID!, $difficulty: MissionDifficulty!, $skillsTested: [String!]!, $courseId: UUID) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  mission_insert(data: { title: $title, scenarioDescription: $scenarioDescription, durationMinutes: $durationMinutes, categoryId: $categoryId, difficulty: $difficulty, skillsTested: $skillsTested, courseId: $courseId, authorId_expr: "auth.uid", createdById_expr: "auth.uid" })
}

mutation AdminUpdateMission($missionId: UUID!, $title: String, $scenarioDescription: String, $durationMinutes: Int, $categoryId: UUID, $difficulty: MissionDifficulty, $skillsTested: [String!], $courseId: UUID) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  mission_update(id: $missionId, data: { title: $title, scenarioDescription: $scenarioDescription, durationMinutes: $durationMinutes, categoryId: $categoryId, difficulty: $difficulty, skillsTested: $skillsTested, courseId: $courseId, updatedAt_expr: "request.time" })
}

mutation AdminSoftDeleteMission($missionId: UUID!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  mission_update(id: $missionId, data: { deletedAt_expr: "request.time" })
}

query AdminGetMission($missionId: UUID!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  mission(id: $missionId) { id title scenarioDescription durationMinutes difficulty skillsTested deletedAt createdAt updatedAt category { id name } course { id title } author { id name email avatar } createdBy { id name } microLessons: missionMicroLessons_on_mission(orderBy: [{ order: ASC }]) { id title type assetUrl content durationSeconds order } templates: missionTemplates_on_mission { id title fileUrl fileType } criteria: rubricCriteria_on_mission(orderBy: [{ order: ASC }]) { id criterionName description maxPoints order } }
}

query AdminListMyMissions @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missions(where: { authorId: { eq_expr: "auth.uid" }, deletedAt: { eq: null } }, orderBy: [{ updatedAt: DESC }]) { id title difficulty durationMinutes updatedAt category { name } course { id title } }
}

# ==========================================
# ADMIN / INSTRUCTOR — MICRO-LESSON MANAGEMENT
# ==========================================

mutation AdminCreateMicroLesson($missionId: UUID!, $title: String!, $type: LectureType!, $assetUrl: String, $content: String, $durationSeconds: Int, $order: Int!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionMicroLesson_insert(data: { missionId: $missionId, title: $title, type: $type, assetUrl: $assetUrl, content: $content, durationSeconds: $durationSeconds, order: $order })
}

mutation AdminUpdateMicroLesson($microLessonId: UUID!, $title: String, $type: LectureType, $assetUrl: String, $content: String, $durationSeconds: Int) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionMicroLesson_update(id: $microLessonId, data: { title: $title, type: $type, assetUrl: $assetUrl, content: $content, durationSeconds: $durationSeconds })
}

mutation AdminDeleteMicroLesson($microLessonId: UUID!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionMicroLesson_delete(id: $microLessonId)
}

mutation AdminUpdateMicroLessonOrder($microLessonId: UUID!, $order: Int!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionMicroLesson_update(id: $microLessonId, data: { order: $order })
}

# ==========================================
# ADMIN / INSTRUCTOR — TEMPLATE MANAGEMENT
# ==========================================

mutation AdminCreateMissionTemplate($missionId: UUID!, $title: String!, $fileUrl: String!, $fileType: String!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionTemplate_insert(data: { missionId: $missionId, title: $title, fileUrl: $fileUrl, fileType: $fileType })
}

mutation AdminDeleteMissionTemplate($templateId: UUID!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  missionTemplate_delete(id: $templateId)
}

query GetMissionTemplates($missionId: UUID!) @auth(level: USER) {
  missionTemplates(where: { missionId: { eq: $missionId } }) { id title fileUrl fileType }
}

# ==========================================
# ADMIN / INSTRUCTOR — RUBRIC MANAGEMENT
# ==========================================

mutation AdminCreateRubricCriterion($missionId: UUID!, $criterionName: String!, $description: String, $maxPoints: Float!, $order: Int!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  rubricCriterion_insert(data: { missionId: $missionId, criterionName: $criterionName, description: $description, maxPoints: $maxPoints, order: $order })
}

mutation AdminUpdateRubricCriterion($criterionId: UUID!, $criterionName: String, $description: String, $maxPoints: Float) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  rubricCriterion_update(id: $criterionId, data: { criterionName: $criterionName, description: $description, maxPoints: $maxPoints })
}

mutation AdminDeleteRubricCriterion($criterionId: UUID!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  rubricCriterion_delete(id: $criterionId)
}

mutation AdminUpdateRubricCriterionOrder($criterionId: UUID!, $order: Int!) @auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  rubricCriterion_update(id: $criterionId, data: { order: $order })
}