# ==========================================
# PUBLIC / STUDENT QUERIES
# ==========================================

# Retrieves all platform categories (e.g., for dropdowns and filtering)
query ListCategories @auth(level: PUBLIC, insecureReason: "Categories are public taxonomy data.") {
  categories(orderBy: [{ name: ASC }]) {
    id
    name
    description
  }
}

# Lists all published courses available for public discovery
query ListPublishedCourses @auth(level: PUBLIC, insecureReason: "Safe for public course discovery.") {
  courses(
    where: {
      status: { eq: PUBLISHED },
      deletedAt: { eq: null }
    },
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    title
    price
    level
    thumbnail
    tags
    avgRating
    ratingCount
    category { name }
    author { name avatar }
  }
}

# Searches published courses strictly by their title
query SearchPublishedCourses($searchQuery: String!) @auth(level: PUBLIC, insecureReason: "Safe for public course discovery.") {
  courses(
    where: {
      status: { eq: PUBLISHED },
      deletedAt: { eq: null },
      title: { contains: $searchQuery }
    },
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    title
    price
    level
    thumbnail
    tags
    category { name }
    author { name avatar }
  }
}

# Most popular published courses for discovery carousels ("Popular Courses").
# Popularity is proxied by the denormalised rating aggregate (ratingCount, then
# avgRating) — the same cache ListPublishedCourses already exposes — so the list
# is a single indexed read with no per-course fan-out. $limit is clamped by the
# service (PopularCoursesService default/max). PUBLIC, like ListPublishedCourses.
query ListPopularCourses($limit: Int) @auth(level: PUBLIC, insecureReason: "Popular course cards are public discovery data, like the course listing.") {
  courses(
    where: {
      status: { eq: PUBLISHED },
      deletedAt: { eq: null }
    },
    orderBy: [{ ratingCount: DESC }, { avgRating: DESC }, { createdAt: DESC }],
    limit: $limit
  ) {
    id
    title
    price
    level
    thumbnail
    tags
    avgRating
    ratingCount
    category { name }
    author { name avatar }
  }
}

# Published courses in the given categories, excluding a set of course ids
# (the caller's already-enrolled courses). Drives "Recommended Courses": the
# backend derives $categoryIds from the courses the user is enrolled in and
# passes their enrolled course ids as $excludeIds so recommendations never repeat
# what they already own. Ordered by rating so the strongest picks surface first.
# PUBLIC (course cards are public); the personalization inputs come from a
# separate USER-scoped read in the backend.
query ListRecommendedCourses(
  $categoryIds: [UUID!]!,
  $excludeIds: [UUID!]!,
  $limit: Int
) @auth(level: PUBLIC, insecureReason: "Recommended course cards are public discovery data; personalization inputs are supplied by the backend.") {
  courses(
    where: {
      status: { eq: PUBLISHED },
      deletedAt: { eq: null },
      categoryId: { in: $categoryIds },
      id: { nin: $excludeIds }
    },
    orderBy: [{ avgRating: DESC }, { ratingCount: DESC }, { createdAt: DESC }],
    limit: $limit
  ) {
    id
    title
    price
    level
    thumbnail
    tags
    avgRating
    ratingCount
    category { name }
    author { name avatar }
  }
}

# Categories of the courses the authenticated user is enrolled in (+ the course
# ids themselves), used to seed ListRecommendedCourses. Self-scoped by auth.uid,
# so it is safe as a USER-level read. Only ACTIVE/COMPLETED enrollments count as
# "interests"; DROPPED/SUSPENDED are excluded.
query GetMyEnrolledCourseCategories @auth(level: USER) {
  enrollments(
    where: {
      userId: { eq_expr: "auth.uid" },
      targetType: { eq: COURSE },
      status: { in: [ACTIVE, COMPLETED] }
    }
  ) {
    course {
      id
      deletedAt
      status
      category { id }
    }
  }
}

# "Continue Learning": every course the authenticated user is enrolled in, with
# the per-lecture completion flags needed to rank them by progress. Self-scoped
# by auth.uid (both the enrollment filter and the nested lectureProgresses), so
# it is safe as a USER-level read. The service counts completed vs. total
# lectures per course and sorts by completed-lesson count (highest first).
query GetMyContinueLearning @auth(level: USER) {
  enrollments(
    where: {
      userId: { eq_expr: "auth.uid" },
      targetType: { eq: COURSE },
      status: { in: [ACTIVE, COMPLETED] }
    },
    orderBy: [{ enrolledAt: DESC }]
  ) {
    id
    status
    enrolledAt
    completedAt
    course {
      id
      title
      thumbnail
      level
      price
      deletedAt
      category { name }
      author { name avatar }
      # Aliases are deliberately unique (cl* = continue-learning) rather than the
      # progressSections/progressLectures/userProgress names used by
      # GetMyCourseProgress: with clientCache enabled, Data Connect requires the
      # same alias on the same type to carry identical arguments across every
      # operation, so reusing them (with different args) fails schema validation.
      clSections: courseSections_on_course(
        where: { deletedAt: { eq: null } }
      ) {
        clLectures: courseLectures_on_section(
          where: { deletedAt: { eq: null } }
        ) {
          id
          clProgress: lectureProgresses_on_lecture(
            where: { userId: { eq_expr: "auth.uid" } }
          ) {
            completedAt
          }
        }
      }
    }
  }
}

# Descriptions of every uploaded VIDEO lecture in a course ("Video Description").
# NO_ACCESS for the same reason as GetCourseCurriculum: it returns each video's
# `content` (its description), which may be paid material. Backend-only; run via
# the service account after CoursesService gates access, which strips the
# description from non-free-preview videos for callers who aren't the owner/admin
# or an active enrollee (mirroring the curriculum entitlement).
query GetCourseVideos($courseId: UUID!) @auth(level: NO_ACCESS) {
  course(id: $courseId) {
    id
    title
    status
    deletedAt
    author { id }
    createdBy { id }
    videoSections: courseSections_on_course(
      where: { deletedAt: { eq: null } },
      orderBy: [{ order: ASC }]
    ) {
      id
      title
      videoLectures: courseLectures_on_section(
        where: { deletedAt: { eq: null }, type: { eq: VIDEO } },
        orderBy: [{ order: ASC }]
      ) {
        id
        title
        content
        duration
        isFreePreview
        order
      }
    }
  }
}

# Retrieves full curriculum details for a specific course. NO_ACCESS: it returns
# every lecture's `content`, so a USER-level version leaked paid READING content
# to any authenticated user. Backend-only; CatalogService strips `content` from
# non-free-preview lectures for callers who aren't the owner/admin or an active enrollee.
query GetCourseCurriculum($courseId: UUID!) @auth(level: NO_ACCESS) {
  course(id: $courseId) {
    id
    title
    description
    language
    publishedSections: courseSections_on_course(
      where: { deletedAt: { eq: null } },
      orderBy: [{ order: ASC }]
    ) {
      id
      title
      publishedLectures: courseLectures_on_section(
        where: { deletedAt: { eq: null } },
        orderBy: [{ order: ASC }]
      ) {
        id
        title
        type
        content
        duration
        isFreePreview
      }
    }
  }
}

# Retrieves a specific lecture's content for playback. NO_ACCESS: returns raw
# `content` / storage paths for any lecture, so a USER-level version let a client
# read gated content without enrollment. Backend-only; LecturesService.getContent
# enforces free-preview / owner / active-enrollee before returning signed URLs.
query GetLectureContent($lectureId: UUID!) @auth(level: NO_ACCESS) {
  courseLecture(id: $lectureId) {
    id
    title
    type
    videoUrl
    content
    duration
    transcriptUrl
    isFreePreview
    section {
      course {
        id
        author { id }
        createdBy { id }
      }
    }
  }
}

# Retrieves the authenticated user's progress for a specific lecture
query GetUserLectureProgress($lectureId: UUID!) @auth(level: USER) {
  lectureProgresses(
    where: {
      userId: { eq_expr: "auth.uid" },
      lectureId: { eq: $lectureId }
    }
  ) {
    lastWatchedSecond
    completedAt
  }
}

# Retrieves all lecture progress for a user within a specific course
query GetMyCourseProgress($courseId: UUID!) @auth(level: USER) {
  sections: courseSections(
    where: { courseId: { eq: $courseId }, deletedAt: { eq: null } },
    orderBy: [{ order: ASC }]
  ) {
    id
    title
    progressLectures: courseLectures_on_section(
      where: { deletedAt: { eq: null } },
      orderBy: [{ order: ASC }]
    ) {
      id
      title
      userProgress: lectureProgresses_on_lecture(
        where: { userId: { eq_expr: "auth.uid" } }
      ) {
        completedAt
      }
    }
  }
}

# Minimal course facts for enrollment eligibility checks
query GetCourseForEnrollment($courseId: UUID!) @auth(level: USER) {
  course(id: $courseId) {
    id
    status
    price
    deletedAt
  }
}

# ==========================================
# ADMIN / INSTRUCTOR — COURSE MANAGEMENT
#
# NOTE (RBAC hardening): the privileged authoring MUTATIONS below are
# @auth(level: NO_ACCESS). They are NOT callable with an end-user token (and so
# not reachable from the generated web/mobile client SDKs). They run ONLY via the
# backend's service-account `:executeGraphql` path (see ADMIN_OPERATIONS +
# DataConnectService auto-routing), AFTER the NestJS CourseAccessGuard /
# ResourceOwnershipGuard have verified the caller owns the target course. This
# closes the gap where role alone ('admin' | 'instructor') let any instructor
# edit/delete ANY course by calling the connector directly.
#
# The read queries here remain role-gated; they expose data cross-instructor and
# are a lower-severity follow-up to owner-scope.
# ==========================================

# Retrieves full course details for authoring purposes (includes drafts).
# NO_ACCESS: exposes any course's full draft content, so it is backend-only
# (run via the service account after CourseAccessGuard / ResourceOwnershipGuard).
query AdminGetCourse($courseId: UUID!)
@auth(level: NO_ACCESS) {
  course(id: $courseId) {
    id title description price status language level thumbnail tags deletedAt createdAt updatedAt
    category { id name }
    author { id name email avatar }
    createdBy { id name }
    instructors: courseInstructors_on_course {
      user { id name email avatar }
    }
    adminSections: courseSections_on_course(
      where: { deletedAt: { eq: null } },
      orderBy: [{ order: ASC }]
    ) {
      id title order
      adminLectures: courseLectures_on_section(
        where: { deletedAt: { eq: null } },
        orderBy: [{ order: ASC }]
      ) {
        id title type videoUrl content duration transcriptUrl isFreePreview order
      }
    }
  }
}

# Lists all courses authored by the authenticated user. Self-scoped by auth.uid,
# so it is safe to leave callable with the user's own token.
query AdminListMyCourses
@auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  courses(
    where: {
      authorId: { eq_expr: "auth.uid" },
      deletedAt: { eq: null }
    },
    orderBy: [{ updatedAt: DESC }]
  ) {
    id title status level thumbnail price updatedAt category { name }
  }
}

# Creates a course. Runs via the service account (no auth.uid), so the author is
# passed explicitly as $authorId (the backend-verified caller uid).
mutation AdminCreateCourse(
  $title: String!,
  $description: String,
  $price: Int!,
  $language: String!,
  $level: CourseLevel!,
  $categoryId: UUID!,
  $tags: [String!]!,
  $authorId: String!
)
@auth(level: NO_ACCESS) {
  course_insert(
    data: {
      title: $title,
      description: $description,
      price: $price,
      language: $language,
      level: $level,
      categoryId: $categoryId,
      tags: $tags,
      authorId: $authorId,
      createdById: $authorId,
      status: DRAFT
    }
  )
}

# Updates course metadata
mutation AdminUpdateCourse(
  $courseId: UUID!, $title: String, $description: String, $price: Int, $language: String, $level: CourseLevel, $categoryId: UUID, $tags: [String!], $thumbnail: String
)
@auth(level: NO_ACCESS) {
  course_update(
    id: $courseId,
    data: {
      title: $title, description: $description, price: $price, language: $language, level: $level, categoryId: $categoryId, tags: $tags, thumbnail: $thumbnail, updatedAt_expr: "request.time"
    }
  )
}

# Transitions course status (DRAFT -> PUBLISHED -> ARCHIVED)
mutation AdminUpdateCourseStatus(
  $courseId: UUID!, $status: CourseStatus!
)
@auth(level: NO_ACCESS) {
  course_update(
    id: $courseId,
    data: {
      status: $status, updatedAt_expr: "request.time"
    }
  )
}

# Soft-deletes (archives) a course. Backend-only (NO_ACCESS), run via the service
# account after CourseAccessGuard verifies ownership. Replaces a stale call to a
# non-existent "AdminDeleteCourse" operation.
mutation AdminSoftDeleteCourse($courseId: UUID!)
@auth(level: NO_ACCESS) {
  course_update(
    id: $courseId,
    data: {
      deletedAt_expr: "request.time", status: ARCHIVED, updatedAt_expr: "request.time"
    }
  )
}

# ==========================================
# ADMIN / INSTRUCTOR — SECTION MANAGEMENT
# ==========================================

mutation AdminCreateSection(
  $courseId: UUID!, $title: String!, $order: Int!
)
@auth(level: NO_ACCESS) {
  courseSection_insert(data: { courseId: $courseId, title: $title, order: $order })
}

mutation AdminUpdateSection(
  $sectionId: UUID!, $title: String!
)
@auth(level: NO_ACCESS) {
  courseSection_update(id: $sectionId, data: { title: $title, updatedAt_expr: "request.time" })
}

mutation AdminSoftDeleteSection($sectionId: UUID!)
@auth(level: NO_ACCESS) {
  courseSection_update(id: $sectionId, data: { deletedAt_expr: "request.time", updatedAt_expr: "request.time" })
}

mutation AdminUpdateSectionOrder(
  $sectionId: UUID!, $order: Int!
)
@auth(level: NO_ACCESS) {
  courseSection_update(id: $sectionId, data: { order: $order, updatedAt_expr: "request.time" })
}

# ==========================================
# ADMIN / INSTRUCTOR — LECTURE MANAGEMENT
# ==========================================

mutation AdminCreateLectureFull(
  $sectionId: UUID!, $title: String!, $type: LectureType!, $videoUrl: String, $content: String, $duration: Int, $transcriptUrl: String, $isFreePreview: Boolean!, $order: Int!
)
@auth(level: NO_ACCESS) {
  courseLecture_insert(
    data: {
      sectionId: $sectionId, title: $title, type: $type, videoUrl: $videoUrl, content: $content, duration: $duration, transcriptUrl: $transcriptUrl, isFreePreview: $isFreePreview, order: $order
    }
  )
}

mutation AdminUpdateLecture(
  $lectureId: UUID!, $title: String, $type: LectureType, $videoUrl: String, $content: String, $duration: Int, $transcriptUrl: String, $isFreePreview: Boolean
)
@auth(level: NO_ACCESS) {
  courseLecture_update(
    id: $lectureId,
    data: {
      title: $title, type: $type, videoUrl: $videoUrl, content: $content, duration: $duration, transcriptUrl: $transcriptUrl, isFreePreview: $isFreePreview, updatedAt_expr: "request.time"
    }
  )
}

mutation AdminSoftDeleteLecture($lectureId: UUID!)
@auth(level: NO_ACCESS) {
  courseLecture_update(id: $lectureId, data: { deletedAt_expr: "request.time", updatedAt_expr: "request.time" })
}

mutation AdminUpdateLectureOrder(
  $lectureId: UUID!, $order: Int!
)
@auth(level: NO_ACCESS) {
  courseLecture_update(id: $lectureId, data: { order: $order, updatedAt_expr: "request.time" })
}

mutation AdminMoveLectureToSection(
  $lectureId: UUID!, $newSectionId: UUID!, $order: Int!
)
@auth(level: NO_ACCESS) {
  courseLecture_update(id: $lectureId, data: { sectionId: $newSectionId, order: $order, updatedAt_expr: "request.time" })
}

mutation AdminSoftDeleteLecturesBySection($sectionId: UUID!)
@auth(level: NO_ACCESS) {
  courseLecture_updateMany(
    where: { sectionId: { eq: $sectionId }, deletedAt: { eq: null } },
    data: { deletedAt_expr: "request.time", updatedAt_expr: "request.time" }
  )
}
