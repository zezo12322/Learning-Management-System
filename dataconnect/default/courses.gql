# Lists all published courses available for public discovery
query ListPublishedCourses @auth(level: PUBLIC, insecureReason: "Safe for public course discovery.") {
  courses(
    where: { 
      status: { eq: PUBLISHED },
      deletedAt: { eq: null } 
    }, 
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    title
    price
    level
    thumbnail
    tags
    category { name } 
    author { name avatar }
  }
}

# Retrieves full curriculum details for a specific course
query GetCourseCurriculum($courseId: UUID!) @auth(level: USER) {
  course(id: $courseId) {
    id
    title
    description
    language
    courseSections_on_course(orderBy: [{ order: ASC }]) {
      id
      title
      courseLectures_on_section(
        where: { deletedAt: { eq: null } }, 
        orderBy: [{ order: ASC }]
      ) {
        id
        title
        type
        content 
        duration
        isFreePreview
      }
    }
  }
}