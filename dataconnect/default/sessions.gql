# Fetches upcoming live sessions or physical classes for a course
query GetCourseSessions($courseId: UUID!) @auth(level: USER) {
  sessions(
    where: { 
      courseId: { eq: $courseId },
      deletedAt: { eq: null }
    }, 
    orderBy: [{ startTime: ASC }]
  ) {
    id
    title
    startTime
    endTime
    type
    capacity
    locationOrUrl
    hostUser { name avatar }
  }
}

# Records attendance check-in for a live session
mutation CheckInToSession(
  $sessionId: UUID!,
  $status: AttendanceStatus!,
  $method: AttendanceMethod!
) @auth(level: USER) {
  attendance_insert(
    data: {
      studentId_expr: "auth.uid",
      sessionId: $sessionId,
      status: $status,
      method: $method
    }
  )
}