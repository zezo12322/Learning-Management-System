# Fetches certificates belonging to the authenticated user
query MyCertificates @auth(level: USER) {
  certificates(where: { userId: { eq_expr: "auth.uid" } }, orderBy: [{ issuedAt: DESC }]) {
    id
    issuedAt
    expiresAt
    targetType
    verificationHash
    assetUrl
    course { title }
    mission { title }
  }
}

# Verifies a certificate using its public verification hash
query VerifyCertificate($hash: String!) @auth(level: PUBLIC, insecureReason: "Verification hashes are public.") {
  certificates(where: { verificationHash: { eq: $hash } }) {
    issuedAt
    expiresAt
    targetType
    assetUrl
    user { name }
    course { title }
    mission { title }
  }
}