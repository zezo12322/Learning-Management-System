# Gets all student submissions pending review and grading
query GetPendingSubmissions @auth(level: USER) {
  missionSubmissions(
    where: { status: { eq: PENDING } },
    orderBy: [{ submittedAt: ASC }]
  ) {
    id
    fileUrl
    submittedAt
    attemptNumber
    student { name email }
    mission {
      title
      difficulty
      course { title }
    }
  }
}