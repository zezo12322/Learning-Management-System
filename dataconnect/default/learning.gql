# ==========================================
# STUDENT — ENROLLMENT
# ==========================================

# RBAC hardening: NO_ACCESS. A USER-level version let a client self-insert an
# ACTIVE enrollment directly, bypassing EnrollmentService's checks (course must be
# PUBLISHED / exists / dedup) — so a user could enroll into an unpublished draft
# and unlock its gated content. Backend-only now; the enrollee is passed explicitly.
mutation EnrollInCourse($courseId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  enrollment_insert(data: { userId: $userId, targetType: COURSE, courseId: $courseId, status: ACTIVE })
}

mutation EnrollInMission($missionId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  enrollment_insert(data: { userId: $userId, targetType: MISSION, missionId: $missionId, status: ACTIVE })
}

# ==========================================
# STUDENT — PROGRESS TRACKING
# ==========================================

# RBAC hardening: NO_ACCESS. completedAt is caller-supplied and the completion
# cascade trusts these rows, so a USER-level version let a student fake lecture
# completion (directly, via the SDK) and then have the backend mark the course
# COMPLETED. Backend-only now; the progress owner is passed explicitly. (The
# high-frequency heartbeat path already uses the NO_ACCESS AdminUpsertLectureProgress.)
mutation UpdateLectureProgress($lectureId: UUID!, $lastWatchedSecond: Int!, $completedAt: Timestamp, $userId: String!) @auth(level: NO_ACCESS) {
  lectureProgress_upsert(data: { userId: $userId, lectureId: $lectureId, lastWatchedSecond: $lastWatchedSecond, completedAt: $completedAt })
}

mutation AdminUpsertLectureProgress($userId: String!, $lectureId: UUID!, $lastWatchedSecond: Int!, $completedAt: Timestamp) @auth(level: NO_ACCESS) {
  lectureProgress_upsert(data: { userId: $userId, lectureId: $lectureId, lastWatchedSecond: $lastWatchedSecond, completedAt: $completedAt })
}

query GetLectureDuration($lectureId: UUID!) @auth(level: NO_ACCESS) {
  courseLecture(id: $lectureId) { id duration section { course { id } } }
}

# ==========================================
# COMPLETION TRACKING
# ==========================================

query GetCourseCompletionStatus($courseId: UUID!) @auth(level: USER) {
  sections: courseSections(where: { courseId: { eq: $courseId }, deletedAt: { eq: null } }) {
    completionLectures: courseLectures_on_section(where: { deletedAt: { eq: null } }) {
      id completionProgress: lectureProgresses_on_lecture(where: { userId: { eq_expr: "auth.uid" } }) { completedAt }
    }
  }
}

query GetCourseCompletionStatusForUser($courseId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  sections: courseSections(where: { courseId: { eq: $courseId }, deletedAt: { eq: null } }) {
    userCompletionLectures: courseLectures_on_section(where: { deletedAt: { eq: null } }) {
      id userCompletionProgress: lectureProgresses_on_lecture(where: { userId: { eq: $userId } }) { completedAt }
    }
  }
}

query GetUserEnrollmentForCourseByUser($courseId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  enrollments(where: { userId: { eq: $userId }, courseId: { eq: $courseId }, targetType: { eq: COURSE } }) { id status completedAt }
}

# RBAC hardening: NO_ACCESS. status/completedAt are caller-supplied, so a USER-level
# version let a student self-mark their own enrollment COMPLETED (forging course/
# mission completion). Backend-only: EnrollmentService resolves the caller's own
# enrollment first, CompletionService drives legitimate COMPLETED transitions.
mutation UpdateEnrollmentStatus($enrollmentId: UUID!, $status: EnrollmentStatus!, $completedAt: Timestamp) @auth(level: NO_ACCESS) {
  enrollment_updateMany(
    where: { id: { eq: $enrollmentId }, userId: { eq_expr: "auth.uid" } },
    data: { status: $status, completedAt: $completedAt }
  )
}

query GetUserEnrollmentForCourse($courseId: UUID!) @auth(level: USER) {
  enrollments(where: { userId: { eq_expr: "auth.uid" }, courseId: { eq: $courseId }, targetType: { eq: COURSE } }) { id status completedAt }
}

query GetUserEnrollmentForMission($missionId: UUID!) @auth(level: USER) {
  enrollments(where: { userId: { eq_expr: "auth.uid" }, missionId: { eq: $missionId }, targetType: { eq: MISSION } }) { id status completedAt }
}