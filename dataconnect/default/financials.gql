# RBAC hardening: NO_ACCESS. Payment records must be trustworthy — a USER-level
# insert let a client fabricate its own payment rows. When a real payment flow is
# built it must be driven by the gateway webhook via the backend service account,
# never inserted directly by a client.
mutation LogPayment(
  $gateway: PaymentGateway!,
  $referenceId: String!,
  $amount: Int!,
  $currency: String = "EGP",
  $customerEmailSnapshot: String!
) @auth(level: NO_ACCESS) {
  payment_insert(
    data: {
      userId_expr: "auth.uid",
      customerEmailSnapshot: $customerEmailSnapshot,
      gateway: $gateway,
      status: PENDING,
      referenceId: $referenceId,
      amount: $amount,
      currency: $currency
    }
  )
}

mutation UpdatePaymentStatusByReference(
  $referenceId: String!,
  $status: PaymentStatus!
) @auth(level: NO_ACCESS) {
  payment_updateMany(
    where: { referenceId: { eq: $referenceId } },
    data: { status: $status }
  )
}

# NO_ACCESS: $paymentId was not owner-scoped, so a USER-level version was an IDOR
# (add line items to another user's payment). Backend/gateway-only, like LogPayment.
mutation AddPaymentItem(
  $paymentId: UUID!,
  $targetType: PaymentItemTarget!,
  $courseId: UUID,
  $missionId: UUID,
  $subscriptionTierId: UUID,
  $price: Int!
) @auth(level: NO_ACCESS) {
  paymentItem_insert(
    data: {
      paymentId: $paymentId,
      targetType: $targetType,
      courseId: $courseId,
      missionId: $missionId,
      subscriptionTierId: $subscriptionTierId,
      priceAtPurchase: $price
    }
  )
}

query MyPaymentHistory @auth(level: USER) {
  payments(where: { userId: { eq_expr: "auth.uid" } }, orderBy: [{ createdAt: DESC }]) {
    id customerEmailSnapshot gateway status amount currency referenceId createdAt paymentItems_on_payment { targetType priceAtPurchase course { title } mission { title } subscriptionTier { name } }
  }
}

query GetPaymentDetailsByReference($referenceId: String!) @auth(level: NO_ACCESS) {
  payments(where: { referenceId: { eq: $referenceId } }) {
    id
    userId
    paymentItems_on_payment {
      targetType
      courseId
      missionId
      subscriptionTierId
    }
  }
}