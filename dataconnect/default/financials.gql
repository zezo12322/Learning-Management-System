mutation LogPayment(
  $gateway: PaymentGateway!, 
  $referenceId: String!,
  $amount: Int!,
  $currency: String = "EGP",
  $customerEmailSnapshot: String!
) @auth(level: USER) { 
  payment_insert(
    data: {
      userId_expr: "auth.uid",
      customerEmailSnapshot: $customerEmailSnapshot,
      gateway: $gateway,
      status: PENDING,
      referenceId: $referenceId,
      amount: $amount,
      currency: $currency
    }
  )
}

mutation AddPaymentItem(
  $paymentId: UUID!,
  $targetType: PaymentItemTarget!,
  $courseId: UUID,
  $missionId: UUID,
  $subscriptionTierId: UUID,
  $price: Int! 
) @auth(level: USER) {
  paymentItem_insert(
    data: {
      paymentId: $paymentId,
      targetType: $targetType,
      courseId: $courseId,
      missionId: $missionId,
      subscriptionTierId: $subscriptionTierId,
      priceAtPurchase: $price
    }
  )
}

query MyPaymentHistory @auth(level: USER) {
  payments(where: { userId: { eq_expr: "auth.uid" } }, orderBy: [{ createdAt: DESC }]) {
    id customerEmailSnapshot gateway status amount currency referenceId createdAt paymentItems_on_payment { targetType priceAtPurchase course { title } mission { title } subscriptionTier { name } }
  }
}