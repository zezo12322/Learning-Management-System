# ==========================================
# ADMIN OPERATIONS - Terms of Service
# ==========================================
mutation CreateToS(
  $version: String!
  $title: String!
  $documentUrl: String!
  $effectiveDate: Timestamp
) @auth(level: NO_ACCESS) {
  tosVersion_insert(
    data: {
      version: $version
      title: $title
      documentUrl: $documentUrl
      effectiveAt: $effectiveDate
      isCurrent: false
    }
  )
}

mutation PublishToS($tosId: UUID!) @auth(level: NO_ACCESS) {
  # Archive all current ToS versions
  tosVersion_updateMany(
    where: { isCurrent: { eq: true } }
    data: { isCurrent: false, updatedAt_expr: "request.time" }
  )
  # Set the new one as current with publishedAt timestamp
  tosVersion_update(
    id: $tosId
    data: {
      isCurrent: true
      publishedAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
}

mutation UpdateToS(
  $tosId: UUID!
  $version: String
  $title: String
  $documentUrl: String
  $effectiveDate: Timestamp
) @auth(level: NO_ACCESS) {
  tosVersion_update(
    id: $tosId
    data: {
      version: $version
      title: $title
      documentUrl: $documentUrl
      effectiveAt: $effectiveDate
      updatedAt_expr: "request.time"
    }
  )
}

query GetCurrentToS @auth(level: NO_ACCESS) {
  tosVersions(where: { isCurrent: { eq: true } }, limit: 1) {
    id
    version
    title
    documentUrl
    effectiveAt
    createdAt
    publishedAt
  }
}

query GetToSById($tosId: UUID!) @auth(level: NO_ACCESS) {
  tosVersions(where: { id: { eq: $tosId } }, limit: 1) {
    id
    version
    title
    documentUrl
    effectiveAt
    isCurrent
    createdAt
    publishedAt
  }
}

query GetAllToS @auth(level: NO_ACCESS) {
  tosVersions(orderBy: { effectiveAt: DESC }) {
    id
    version
    title
    documentUrl
    effectiveAt
    isCurrent
    createdAt
  }
}

# ==========================================
# USER OPERATIONS - Terms of Service
# ==========================================

query GetUserToSStatus($uid: String!) @auth(level: NO_ACCESS) {
  user(id: $uid) {
    id
    acceptedTosId
    tosAcceptedAt
  }
}

mutation AcceptCurrentToS($tosId: UUID!) @auth(level: USER) {
  user_upsert(
    data: {
      id_expr: "auth.uid"
      acceptedTosId: $tosId
      tosAcceptedAt_expr: "request.time"
    }
  )
}
