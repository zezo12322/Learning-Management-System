# ==========================================
# 1. COURSE CREATION & MANAGEMENT
#
# NOTE: AdminCreateCourse moved to courses.gql and is now @auth(level: NO_ACCESS)
# (backend-service-account only, author passed explicitly) — see the RBAC
# hardening note there. Duplicating the operation name here would break the
# connector build.
#
# InstructorDeleteCourse / SuperAdminDeleteCourse are left as-is: the former is
# owner-scoped (authorId == auth.uid), the latter is admin-only — neither allows
# a cross-tenant write.
# ==========================================

mutation InstructorDeleteCourse($courseId: UUID!)
@auth(expr: "auth.token.roles != null && 'instructor' in auth.token.roles") {
  course_updateMany(
    where: {
      id: { eq: $courseId },
      authorId: { eq_expr: "auth.uid" } 
    },
    data: {
      deletedAt_expr: "request.time",
      status: ARCHIVED
    }
  )
}

mutation SuperAdminDeleteCourse($courseId: UUID!) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  course_update(
    id: $courseId, 
    data: {
      deletedAt_expr: "request.time",
      status: ARCHIVED
    }
  )
}

# ==========================================
# 2. SESSION & LIVE CLASS SCHEDULING
# ==========================================

# RBAC hardening: NO_ACCESS. Role alone (admin|instructor) with a $courseId and
# no ownership check let any instructor create a session on ANY course
# (cross-tenant write). No backend route consumes this yet; when built it must run
# via the service account after CourseAccessGuard verifies course ownership.
mutation AdminCreateSession(
  $courseId: UUID!,
  $title: String!,
  $capacity: Int,
  $startTime: Timestamp!,
  $endTime: Timestamp!,
  $type: SessionType!,
  $locationOrUrl: String!
)
@auth(level: NO_ACCESS) {
  session_insert(
    data: {
      courseId: $courseId,
      title: $title,
      capacity: $capacity,
      startTime: $startTime,
      endTime: $endTime,
      type: $type,
      locationOrUrl: $locationOrUrl,
      hostUserId_expr: "auth.uid" 
    }
  )
}

mutation InstructorCancelSession($sessionId: UUID!) 
@auth(expr: "auth.token.roles != null && 'instructor' in auth.token.roles") {
  session_updateMany(
    where: {
      id: { eq: $sessionId },
      hostUserId: { eq_expr: "auth.uid" } 
    },
    data: {
      deletedAt_expr: "request.time"
    }
  )
}

mutation SuperAdminCancelSession($sessionId: UUID!) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  session_update(
    id: $sessionId,
    data: {
      deletedAt_expr: "request.time"
    }
  )
}

# ==========================================
# 3. FINANCIAL & SUBSCRIPTION MANAGEMENT
# ==========================================

mutation AdminCreateSubscriptionTier(
  $name: String!,
  $price: Int!,
  $billingCycle: BillingCycle!,
  $features: [String!]!
) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  subscriptionTier_insert(
    data: {
      name: $name,
      price: $price,
      billingCycle: $billingCycle,
      features: $features,
      isActive: true
    }
  )
}

mutation AdminDeprecateSubscriptionTier($tierId: UUID!) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  subscriptionTier_update(
    id: $tierId,
    data: {
      isActive: false
    }
  )
}

# ==========================================
# 4. PLATFORM TAXONOMY
# ==========================================

mutation AdminCreateCategory($name: String!, $description: String) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  category_insert(
    data: {
      name: $name,
      description: $description
    }
  )
}