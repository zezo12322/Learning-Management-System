# ==========================================
# 1. COURSE CREATION & MANAGEMENT
# ==========================================

mutation AdminCreateCourse(
  $title: String!, 
  $description: String, 
  $price: Int!,
  $language: String!, 
  $level: CourseLevel!, 
  $categoryId: UUID!,
  $tags: [String!]!
) 
@auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  course_insert(
    data: {
      title: $title, 
      description: $description, 
      price: $price,
      language: $language, 
      level: $level, 
      categoryId: $categoryId,
      tags: $tags, 
      authorId_expr: "auth.uid",    
      createdById_expr: "auth.uid", 
      status: DRAFT
    }
  )
}

mutation InstructorDeleteCourse($courseId: UUID!) 
@auth(expr: "auth.token.roles != null && 'instructor' in auth.token.roles") {
  course_updateMany(
    where: {
      id: { eq: $courseId },
      authorId: { eq_expr: "auth.uid" } 
    },
    data: {
      deletedAt_expr: "request.time",
      status: ARCHIVED
    }
  )
}

mutation SuperAdminDeleteCourse($courseId: UUID!) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  course_update(
    id: $courseId, 
    data: {
      deletedAt_expr: "request.time",
      status: ARCHIVED
    }
  )
}

# ==========================================
# 2. SESSION & LIVE CLASS SCHEDULING
# ==========================================

mutation AdminCreateSession(
  $courseId: UUID!,
  $title: String!,
  $capacity: Int,
  $startTime: Timestamp!,
  $endTime: Timestamp!,
  $type: SessionType!,
  $locationOrUrl: String!
) 
@auth(expr: "auth.token.roles != null && ('admin' in auth.token.roles || 'instructor' in auth.token.roles)") {
  session_insert(
    data: {
      courseId: $courseId,
      title: $title,
      capacity: $capacity,
      startTime: $startTime,
      endTime: $endTime,
      type: $type,
      locationOrUrl: $locationOrUrl,
      hostUserId_expr: "auth.uid" 
    }
  )
}

mutation InstructorCancelSession($sessionId: UUID!) 
@auth(expr: "auth.token.roles != null && 'instructor' in auth.token.roles") {
  session_updateMany(
    where: {
      id: { eq: $sessionId },
      hostUserId: { eq_expr: "auth.uid" } 
    },
    data: {
      deletedAt_expr: "request.time"
    }
  )
}

mutation SuperAdminCancelSession($sessionId: UUID!) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  session_update(
    id: $sessionId,
    data: {
      deletedAt_expr: "request.time"
    }
  )
}

# ==========================================
# 3. FINANCIAL & SUBSCRIPTION MANAGEMENT
# ==========================================

mutation AdminCreateSubscriptionTier(
  $name: String!,
  $price: Int!,
  $billingCycle: BillingCycle!,
  $features: [String!]!
) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  subscriptionTier_insert(
    data: {
      name: $name,
      price: $price,
      billingCycle: $billingCycle,
      features: $features,
      isActive: true
    }
  )
}

mutation AdminDeprecateSubscriptionTier($tierId: UUID!) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  subscriptionTier_update(
    id: $tierId,
    data: {
      isActive: false
    }
  )
}

# ==========================================
# 4. PLATFORM TAXONOMY
# ==========================================

mutation AdminCreateCategory($name: String!, $description: String) 
@auth(expr: "auth.token.roles != null && 'admin' in auth.token.roles") {
  category_insert(
    data: {
      name: $name,
      description: $description
    }
  )
}