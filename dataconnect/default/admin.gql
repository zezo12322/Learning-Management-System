# ==========================================
# 1. COURSE CREATION & MANAGEMENT
# ==========================================

# Create a new course in DRAFT mode
mutation AdminCreateCourse(
  $title: String!, 
  $description: String, 
  $price: Int!,
  $language: String!, 
  $level: CourseLevel!, 
  $categoryId: UUID!,
  $tags: [String!]!
) @auth(level: USER) {
  course_insert(
    data: {
      title: $title, 
      description: $description, 
      price: $price,
      language: $language, 
      level: $level, 
      categoryId: $categoryId,
      tags: $tags, 
      createdById_expr: "auth.uid",
      status: DRAFT
    }
  )
}

# Soft-delete a course
mutation AdminDeleteCourse($courseId: UUID!) @auth(level: USER) {
  course_update(
    id: $courseId,
    data: {
      deletedAt_expr: "request.time",
      status: ARCHIVED
    }
  )
}

# Create a new course section
mutation AdminCreateCourseSection(
  $courseId: UUID!,
  $title: String!,
  $order: Int!
) @auth(level: USER) {
  courseSection_insert(
    data: {
      courseId: $courseId,
      title: $title,
      order: $order
    }
  )
}

# Add a lecture to a course section
mutation AdminCreateLecture(
  $sectionId: UUID!,
  $title: String!,
  $type: LectureType!,
  $videoUrl: String,
  $content: String,
  $order: Int!
) @auth(level: USER) {
  courseLecture_insert(
    data: {
      sectionId: $sectionId,
      title: $title,
      type: $type,
      videoUrl: $videoUrl,
      content: $content,
      isFreePreview: false,
      order: $order
    }
  )
}

# Get instructor's courses
query InstructorCourses @auth(level: USER) {
  courses(
    where: { createdById: { eq_expr: "auth.uid" } },
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    title
    status
    createdAt
    price
    language
    level
  }
}

# ==========================================
# 2. SESSION & LIVE CLASS SCHEDULING
# ==========================================

# Schedule a new Live Session or Physical Class
mutation AdminCreateSession(
  $courseId: UUID!,
  $title: String!,
  $capacity: Int,
  $startTime: Timestamp!,
  $endTime: Timestamp!,
  $type: SessionType!,
  $locationOrUrl: String!
) @auth(level: USER) {
  session_insert(
    data: {
      courseId: $courseId,
      title: $title,
      capacity: $capacity,
      startTime: $startTime,
      endTime: $endTime,
      type: $type,
      locationOrUrl: $locationOrUrl,
      hostUserId_expr: "auth.uid"
    }
  )
}

# Cancel a session
mutation AdminCancelSession($sessionId: UUID!) @auth(level: USER) {
  session_update(
    id: $sessionId,
    data: {
      deletedAt_expr: "request.time"
    }
  )
}

# ==========================================
# 3. FINANCIAL & SUBSCRIPTION MANAGEMENT
# ==========================================

# Create a new Subscription Tier
mutation AdminCreateSubscriptionTier(
  $name: String!,
  $price: Int!,
  $billingCycle: BillingCycle!,
  $features: [String!]!
) @auth(level: USER) {
  subscriptionTier_insert(
    data: {
      name: $name,
      price: $price,
      billingCycle: $billingCycle,
      features: $features,
      isActive: true
    }
  )
}

# Deprecate an old subscription tier
mutation AdminDeprecateSubscriptionTier($tierId: UUID!) @auth(level: USER) {
  subscriptionTier_update(
    id: $tierId,
    data: {
      isActive: false
    }
  )
}

# List active subscription tiers
query ListSubscriptionTiers @auth(level: PUBLIC) {
  subscriptionTiers(where: { isActive: { eq: true } }) {
    id
    name
    price
    billingCycle
    features
  }
}

# ==========================================
# 4. PLATFORM TAXONOMY
# ==========================================

# Create a new course category
mutation AdminCreateCategory($name: String!, $description: String) @auth(level: USER) {
  category_insert(
    data: {
      name: $name,
      description: $description
    }
  )
}

# List all categories
query ListCategories @auth(level: PUBLIC) {
  categories {
    id
    name
    description
  }
}

# ==========================================
# 5. QUIZZES
# ==========================================

# Create a Quiz
mutation AdminCreateQuiz(
  $lectureId: UUID!,
  $passingScore: Float!,
  $maxAttempts: Int!
) @auth(level: USER) {
  courseQuiz_insert(
    data: {
      lectureId: $lectureId,
      passingScore: $passingScore,
      maxAttempts: $maxAttempts
    }
  )
}

# Create a Quiz Question
mutation AdminCreateQuizQuestion(
  $quizId: UUID!,
  $questionText: String!,
  $order: Int!,
  $points: Float = 1.0,
  $correctOptionId: UUID!
) @auth(level: USER) {
  quizQuestion_insert(
    data: {
      quizId: $quizId,
      questionText: $questionText,
      order: $order,
      points: $points,
      correctOptionId: $correctOptionId
    }
  )
}

# Create a Quiz Option
mutation AdminCreateQuizOption(
  $questionId: UUID!,
  $text: String!,
  $order: Int!
) @auth(level: USER) {
  quizOption_insert(
    data: {
      questionId: $questionId,
      text: $text,
      order: $order
    }
  )
}

# ==========================================
# 6. MISSIONS
# ==========================================

# Create a Mission
mutation AdminCreateMission(
  $courseId: UUID,
  $title: String!,
  $scenarioDescription: String!,
  $durationMinutes: Int!,
  $categoryId: UUID!,
  $difficulty: MissionDifficulty!,
  $skillsTested: [String!]!
) @auth(level: USER) {
  mission_insert(
    data: {
      courseId: $courseId,
      title: $title,
      scenarioDescription: $scenarioDescription,
      durationMinutes: $durationMinutes,
      categoryId: $categoryId,
      difficulty: $difficulty,
      skillsTested: $skillsTested
    }
  )
}

# Create a Rubric Criterion
mutation AdminCreateRubricCriterion(
  $missionId: UUID!,
  $criterionName: String!,
  $description: String,
  $maxPoints: Float!,
  $order: Int!
) @auth(level: USER) {
  rubricCriterion_insert(
    data: {
      missionId: $missionId,
      criterionName: $criterionName,
      description: $description,
      maxPoints: $maxPoints,
      order: $order
    }
  )
}

# ==========================================
# 7. CERTIFICATES
# ==========================================

# Issue a certificate
mutation AdminIssueCertificate(
  $userId: String!,
  $targetType: CertificateTarget!,
  $courseId: UUID,
  $missionId: UUID,
  $expiresAt: Timestamp,
  $verificationHash: String!,
  $assetUrl: String!
) @auth(level: USER) {
  certificate_insert(
    data: {
      userId: $userId,
      targetType: $targetType,
      courseId: $courseId,
      missionId: $missionId,
      expiresAt: $expiresAt,
      verificationHash: $verificationHash,
      assetUrl: $assetUrl
    }
  )
}