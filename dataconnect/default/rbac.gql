# ==========================================
# RBAC — OWNERSHIP RESOLUTION
# Used by CourseAccessGuard / AccessService. The global role (admin/instructor/
# student) is NOT here — it lives in the caller's Firebase custom claims and is
# read off the decoded token by RolesGuard. These queries only resolve
# resource ownership, via Course.author, Course.createdBy and the
# CourseInstructor join.
# ==========================================

# Returns ownership facts for a course relative to the caller:
# author / createdBy, plus a (filtered) CourseInstructor row if the caller
# is an assigned instructor. Empty instructor list + non-matching author = no access.
query GetMyCourseAccess($courseId: UUID!) @auth(level: USER) {
  course(id: $courseId) {
    id
    author {
      id
    }
    createdBy {
      id
    }
    myInstructorLink: courseInstructors_on_course(
      where: { userId: { eq_expr: "auth.uid" } }
    ) {
      user {
        id
      }
    }
  }
}

# Ownership facts for a mission (and its owning course, if any).
# A standalone mission (no course) falls back to its own author/createdBy.
query GetMyMissionAccess($missionId: UUID!) @auth(level: USER) {
  mission(id: $missionId) {
    id
    author {
      id
    }
    createdBy {
      id
    }
    course {
      id
      author {
        id
      }
      createdBy {
        id
      }
      myMissionCourseInstructorLink: courseInstructors_on_course(
        where: { userId: { eq_expr: "auth.uid" } }
      ) {
        user {
          id
        }
      }
    }
  }
}

# ==========================================
# LEAF → OWNER CHAIN RESOLUTION
# Used by ResourceOwnershipGuard to resolve a child resource's owning
# course/mission, so the route's :courseId/:missionId need not be trusted.
#
# Each `course` / `mission` node also selects the same ownership facts as
# GetMyCourseAccess / GetMyMissionAccess (author, createdBy, the caller's
# instructor link). This lets the guard authorize from a single query instead
# of resolving the owner here and re-querying ownership separately. The guard
# falls back to the dedicated access query if these fields are absent (e.g. an
# older deployed connector), so the change is deploy-order independent.
# ==========================================

query GetQuestionCourse($questionId: UUID!) @auth(level: USER) {
  quizQuestion(id: $questionId) {
    quiz { lecture { section { course {
      id
      author { id }
      createdBy { id }
      myInstructorLink: courseInstructors_on_course(
        where: { userId: { eq_expr: "auth.uid" } }
      ) { user { id } }
    } } } }
  }
}

