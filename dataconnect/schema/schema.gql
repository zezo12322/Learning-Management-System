# ==========================================
# ENUMS
# ==========================================
enum RoleAction { CREATE, READ, UPDATE, DELETE }
enum CourseStatus { DRAFT, PUBLISHED, ARCHIVED }
enum LectureType { VIDEO, READING, INTERACTIVE, QUIZ }
enum EnrollmentStatus { ACTIVE, COMPLETED, DROPPED, SUSPENDED }
enum SessionType { ONLINE, OFFLINE }
enum AttendanceStatus { PRESENT, LATE, EXCUSED, UNEXCUSED }
enum AttendanceMethod { QR, MANUAL }
enum PaymentGateway { FAWRY, PAYMOB, INSTAPAY }
enum PaymentStatus { PENDING, COMPLETED, FAILED, REFUNDED }
enum SubscriptionStatus { ACTIVE, CANCELLED, SUSPENDED }
enum CourseLevel { BEGINNER, INTERMEDIATE, ADVANCED }
enum MissionDifficulty { BEGINNER, INTERMEDIATE, ADVANCED, EXPERT }
enum BillingCycle { MONTHLY, QUARTERLY, YEARLY }
enum EnrollmentTarget { COURSE, MISSION }
enum CertificateTarget { COURSE, MISSION }
enum PaymentItemTarget { COURSE, MISSION, SUBSCRIPTION }
enum SubmissionStatus { PENDING, GRADED, RETURNED, REJECTED }

# ==========================================
# IDENTITY & ACCESS
# ==========================================
type User @table(name: "users") {
  id: String! @col(name: "uid") 
  email: String!
  name: String!
  avatar: String
  encryptedNationalId: String
  tosAcceptedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time") @index
  lastLogin: Timestamp
}

type Profile @table(name: "profiles", key: ["user"]) {
  user: User! @index 
  bio: String
  company: String
  phone: String
  syncedPreferences: Any 
}

type Role @table(name: "roles") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  description: String
}

type Permission @table(name: "permissions") {
  id: UUID! @default(expr: "uuidV4()")
  action: RoleAction!
  resource: String!
}

type UserRole @table(name: "user_roles", key: ["user", "role"]) {
  user: User! @index 
  role: Role!
}

type RolePermission @table(name: "role_permissions", key: ["role", "permission"]) {
  role: Role!
  permission: Permission!
}

# ==========================================
# TAXONOMY
# ==========================================
type Category @table(name: "categories") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  description: String
}

# ==========================================
# COURSE CONTENT & CURRICULUM
# ==========================================
type Course @table(name: "courses") {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  description: String
  price: Int! 
  status: CourseStatus! @index
  language: String!
  level: CourseLevel!
  thumbnail: String
  category: Category!
  tags: [String!]!
  author: User! @index
  createdBy: User!
  # Denormalised rating aggregate, recomputed by RatingsService on every rating
  # write. Lets catalog/recommendation cards show a star score without an N+1
  # over CourseRating. The authoritative value is always derivable on-read via
  # GetCourseRatingsForSummary; these columns are a cache. Non-null defaults keep
  # the column migration non-destructive (existing rows backfill to 0).
  avgRating: Float! @default(value: 0) @index
  ratingCount: Int! @default(value: 0) @index
  createdAt: Timestamp! @default(expr: "request.time") @index
  updatedAt: Timestamp! @default(expr: "request.time") @index
  deletedAt: Timestamp @index
}

type CourseInstructor @table(name: "course_instructors", key: ["course", "user"]) {
  course: Course! @index
  user: User! @index 
}

type CourseSection @table(name: "course_sections") {
  id: UUID! @default(expr: "uuidV4()")
  course: Course! @index
  title: String!
  order: Int! @index
  createdAt: Timestamp! @default(expr: "request.time") @index
  updatedAt: Timestamp! @default(expr: "request.time") @index
  deletedAt: Timestamp @index
}

type CourseLecture @table(name: "course_lectures") {
  id: UUID! @default(expr: "uuidV4()")
  section: CourseSection! @index
  title: String!
  type: LectureType! @index
  videoUrl: String
  originalVideoUrl: String
  aiJobId: String
  content: String     
  duration: Int
  transcriptUrl: String
  isFreePreview: Boolean!
  order: Int! @index
  createdAt: Timestamp! @default(expr: "request.time") @index
  updatedAt: Timestamp! @default(expr: "request.time") @index
  deletedAt: Timestamp @index
}

# ==========================================
# QUIZZES 
# ==========================================
type CourseQuiz @table(name: "course_quizzes") {
  id: UUID! @default(expr: "uuidV4()")
  lecture: CourseLecture! @index @unique
  passingScore: Float!
  maxAttempts: Int!
  timeLimitMinutes: Int
  createdAt: Timestamp! @default(expr: "request.time") @index
  updatedAt: Timestamp! @default(expr: "request.time") @index
}

type QuizQuestion @table(name: "quiz_questions") {
  id: UUID! @default(expr: "uuidV4()")
  quiz: CourseQuiz! @index
  questionText: String!
  order: Int! @index         
  points: Float! @default(expr: "1.0") 
  explanation: String 
  deletedAt: Timestamp @index
}

type QuizOption @table(name: "quiz_options") { 
  id: UUID! @default(expr: "uuidV4()")
  question: QuizQuestion!
  text: String!
  order: Int! @index
  isCorrect: Boolean! @default(expr: "false") 
}

# ==========================================
# MISSIONS (PROJECTS)
# ==========================================
type Mission @table(name: "missions") {
  id: UUID! @default(expr: "uuidV4()")
  course: Course @index 
  title: String!
  scenarioDescription: String!
  durationMinutes: Int!
  category: Category! 
  difficulty: MissionDifficulty! 
  skillsTested: [String!]!
  author: User! @index        
  createdBy: User!     
  createdAt: Timestamp! @default(expr: "request.time") @index
  updatedAt: Timestamp! @default(expr: "request.time") @index
  deletedAt: Timestamp @index
}

type MissionMicroLesson @table(name: "mission_micro_lessons") {
  id: UUID! @default(expr: "uuidV4()")
  mission: Mission! @index
  title: String!
  type: LectureType! @index
  assetUrl: String 
  content: String
  durationSeconds: Int 
  order: Int! @index
}

type MissionTemplate @table(name: "mission_templates") {
  id: UUID! @default(expr: "uuidV4()")
  mission: Mission! @index
  title: String!
  fileUrl: String!
  fileType: String!
}

type RubricCriterion @table(name: "rubric_criteria") {
  id: UUID! @default(expr: "uuidV4()")
  mission: Mission! @index
  criterionName: String!
  description: String
  maxPoints: Float!
  order: Int! @index 
}

type MissionSubmission @table(name: "mission_submissions") {
  id: UUID! @default(expr: "uuidV4()")
  mission: Mission! @index
  student: User! @index 
  grader: User 
  fileUrl: String!
  feedback: String
  status: SubmissionStatus! @default(expr: "'PENDING'") @index 
  attemptNumber: Int! @default(expr: "1") 
  submittedAt: Timestamp! @default(expr: "request.time") @index 
  updatedAt: Timestamp! @default(expr: "request.time") @index
}

type MissionSubmissionScore @table(name: "mission_submission_scores", key: ["submission", "criterion"]) {
  submission: MissionSubmission!
  criterion: RubricCriterion!
  score: Float!
}

# ==========================================
# TRACKING, ENGAGEMENT & SESSIONS
# ==========================================
type Enrollment @table(name: "enrollments") {
  id: UUID! @default(expr: "uuidV4()")
  user: User! @index 
  targetType: EnrollmentTarget! @index 
  course: Course @index 
  mission: Mission @index 
  status: EnrollmentStatus! @index
  enrolledAt: Timestamp! @default(expr: "request.time") @index
  completedAt: Timestamp @index
}

type LectureProgress @table(name: "lecture_progress", key: ["user", "lecture"]) {
  user: User! @index
  lecture: CourseLecture! @index
  lastWatchedSecond: Int!
  completedAt: Timestamp @index
}

# One rating per (user, course). The composite key enforces that uniqueness at
# the database level and lets the write path use a single upsert (create-or-edit),
# mirroring LectureProgress.
type CourseRating @table(name: "course_ratings", key: ["user", "course"]) {
  user: User! @index
  course: Course! @index
  rating: Int!          # 1–5 stars
  review: String        # optional free-text review
  createdAt: Timestamp! @default(expr: "request.time") @index
  updatedAt: Timestamp! @default(expr: "request.time") @index
}

type QuizAttempt @table(name: "quiz_attempts") {
  id: UUID! @default(expr: "uuidV4()")
  user: User! @index 
  quiz: CourseQuiz! @index
  score: Float      
  passed: Boolean   
  startedAt: Timestamp! @default(expr: "request.time") @index
  completedAt: Timestamp @index
}

type QuizAttemptAnswer @table(name: "quiz_attempt_answers", key: ["attempt", "question"]) {
  attempt: QuizAttempt!
  question: QuizQuestion!
  selectedOption: QuizOption!
}

type Session @table(name: "sessions") {
  id: UUID! @default(expr: "uuidV4()")
  course: Course! @index
  title: String!
  hostUser: User      
  capacity: Int       
  startTime: Timestamp! @index
  endTime: Timestamp!
  type: SessionType!
  locationOrUrl: String!
  qrCodeHash: String
  createdAt: Timestamp! @default(expr: "request.time") @index
  updatedAt: Timestamp! @default(expr: "request.time") @index
  deletedAt: Timestamp @index
}

type Attendance @table(name: "attendance") {
  id: UUID! @default(expr: "uuidV4()")
  student: User! @index 
  session: Session!
  status: AttendanceStatus!
  method: AttendanceMethod!
  timestamp: Timestamp! @default(expr: "request.time")
}

# ==========================================
# CERTIFICATES
# ==========================================
type Certificate @table(name: "certificates") {
  id: UUID! @default(expr: "uuidV4()")
  user: User! @index 
  targetType: CertificateTarget! 
  course: Course @index
  mission: Mission @index
  issuedAt: Timestamp! @default(expr: "request.time") @index
  expiresAt: Timestamp           
  verificationHash: String! @unique
  assetUrl: String!
}

# ==========================================
# FINANCIALS & SUBSCRIPTIONS
# ==========================================
type SubscriptionTier @table(name: "subscription_tiers") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  price: Int! 
  billingCycle: BillingCycle! 
  features: [String!]!        
  isActive: Boolean! @default(expr: "true") 
}

type Payment @table(name: "payments") {
  id: UUID! @default(expr: "uuidV4()")
  
  # 1. Relation is now optional (User instead of User!) and implicitly uses SET_NULL
  user: User @index
  
  # 2. Static Snapshot: Store this at checkout so you never lose the audit trail!
  #    Default '' makes the column migration non-destructive (existing rows get
  #    filled automatically). New rows always set the real value in LogPayment
  #    via auth.token.email, so the default only ever applies to back-migration.
  customerEmailSnapshot: String! @default(expr: "''")
  
  gateway: PaymentGateway!
  status: PaymentStatus! @index
  amount: Int!               
  currency: String! @default(expr: "'EGP'") 
  referenceId: String! @unique
  createdAt: Timestamp! @default(expr: "request.time") @index
  updatedAt: Timestamp! @default(expr: "request.time") @index
}

type UserSubscription @table(name: "user_subscriptions") {
  id: UUID! @default(expr: "uuidV4()")
  
  # Subscriptions are kept for historical metrics, but the user link is severed
  user: User @index
  
  tier: SubscriptionTier!
  payment: Payment           
  status: SubscriptionStatus!
  startDate: Timestamp!
  endDate: Timestamp!
  autoRenew: Boolean!
  cancelledAt: Timestamp     
  cancelReason: String       
}

type PaymentItem @table(name: "payment_items") {
  id: UUID! @default(expr: "uuidV4()")
  payment: Payment!
  targetType: PaymentItemTarget! 
  course: Course @index
  mission: Mission @index
  subscriptionTier: SubscriptionTier 
  priceAtPurchase: Int! 
}