# ==========================================
# ENUMS
# ==========================================
enum RoleAction { CREATE, READ, UPDATE, DELETE }
enum CourseStatus { DRAFT, PUBLISHED, ARCHIVED }
enum LectureType { VIDEO, READING, INTERACTIVE, QUIZ }
enum EnrollmentStatus { ACTIVE, COMPLETED, DROPPED, SUSPENDED }
enum SessionType { ONLINE, OFFLINE }
enum AttendanceStatus { PRESENT, LATE, EXCUSED, UNEXCUSED }
enum AttendanceMethod { QR, MANUAL }
enum PaymentGateway { FAWRY, PAYMOB, INSTAPAY }
enum PaymentStatus { PENDING, COMPLETED, FAILED, REFUNDED }
enum SubscriptionStatus { ACTIVE, CANCELLED, SUSPENDED }

# NEW: Strict Enums for classification and polymorphic logic
enum CourseLevel { BEGINNER, INTERMEDIATE, ADVANCED }
enum MissionDifficulty { BEGINNER, INTERMEDIATE, ADVANCED, EXPERT }
enum BillingCycle { MONTHLY, QUARTERLY, YEARLY }
enum EnrollmentTarget { COURSE, MISSION }
enum CertificateTarget { COURSE, MISSION }
enum PaymentItemTarget { COURSE, MISSION, SUBSCRIPTION }
enum SubmissionStatus { PENDING, GRADED, RETURNED, REJECTED }

# ==========================================
# IDENTITY & ACCESS
# ==========================================
type User @table(name: "users") {
  id: String! @col(name: "uid") 
  email: String!
  name: String!
  avatar: String
  createdAt: Timestamp! @default(expr: "request.time")
  lastLogin: Timestamp
}

type Profile @table(name: "profiles", key: ["user"]) {
  user: User!
  bio: String
  company: String
  phone: String
  syncedPreferences: Any # Acceptable use of Any for truly dynamic frontend UI toggles
}

type Role @table(name: "roles") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  description: String
}

type Permission @table(name: "permissions") {
  id: UUID! @default(expr: "uuidV4()")
  action: RoleAction!
  resource: String!
}

type UserRole @table(name: "user_roles", key: ["user", "role"]) {
  user: User!
  role: Role!
}

type RolePermission @table(name: "role_permissions", key: ["role", "permission"]) {
  role: Role!
  permission: Permission!
}

# ==========================================
# TAXONOMY (NEW)
# ==========================================
type Category @table(name: "categories") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  description: String
}

# ==========================================
# COURSE CONTENT & CURRICULUM
# ==========================================
type Course @table(name: "courses") {
  id: UUID! @default(expr: "uuidV4()")
  title: String!
  description: String
  price: Int! 
  status: CourseStatus!
  language: String!
  level: CourseLevel! # FIXED: Enum
  thumbnail: String
  category: Category! # FIXED: Foreign Key mapping
  tags: [String!]!    # FIXED: Non-null array items
  createdBy: User!    # FIXED: Audit trail
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  deletedAt: Timestamp # FIXED: Soft deletes
}

type CourseInstructor @table(name: "course_instructors", key: ["course", "user"]) {
  course: Course!
  user: User!
  isPrimary: Boolean! @default(expr: "false") # FIXED: Distinguish lead
}

type CourseSection @table(name: "course_sections") {
  id: UUID! @default(expr: "uuidV4()")
  course: Course!
  title: String!
  order: Int!
}

type CourseLecture @table(name: "course_lectures") {
  id: UUID! @default(expr: "uuidV4()")
  section: CourseSection!
  title: String!
  type: LectureType!
  videoUrl: String
  content: String     # FIXED: Field for READING type lectures
  duration: Int
  transcriptUrl: String
  isFreePreview: Boolean!
  order: Int!
  deletedAt: Timestamp
}

# ==========================================
# QUIZZES (REFACTORED)
# ==========================================
type CourseQuiz @table(name: "course_quizzes") {
  id: UUID! @default(expr: "uuidV4()")
  lecture: CourseLecture! @unique
  passingScore: Float!
  maxAttempts: Int!
}

type QuizQuestion @table(name: "quiz_questions") {
  id: UUID! @default(expr: "uuidV4()")
  quiz: CourseQuiz!
  questionText: String!
  order: Int!         # FIXED: Added order
  points: Float! @default(expr: "1.0") # FIXED: Added points
  explanation: String # FIXED: Added post-answer explanation
  correctOptionId: UUID! # Stores ID to break circular FK dependency
  deletedAt: Timestamp
}

type QuizOption @table(name: "quiz_options") { # FIXED: Replaced 'Any' JSON options
  id: UUID! @default(expr: "uuidV4()")
  question: QuizQuestion!
  text: String!
  order: Int!
}

# ==========================================
# MISSIONS (PROJECTS)
# ==========================================
type Mission @table(name: "missions") {
  id: UUID! @default(expr: "uuidV4()")
  course: Course 
  title: String!
  scenarioDescription: String!
  durationMinutes: Int!
  category: Category! # FIXED: Foreign key mapping
  difficulty: MissionDifficulty! # FIXED: Enum
  skillsTested: [String!]! # FIXED: Strict array
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  deletedAt: Timestamp
}

type MissionMicroLesson @table(name: "mission_micro_lessons") {
  id: UUID! @default(expr: "uuidV4()")
  mission: Mission!
  title: String!
  type: LectureType!
  assetUrl: String 
  content: String
  durationSeconds: Int 
  order: Int!
}

type MissionTemplate @table(name: "mission_templates") {
  id: UUID! @default(expr: "uuidV4()")
  mission: Mission!
  title: String!
  fileUrl: String!
  fileType: String!
}

type RubricCriterion @table(name: "rubric_criteria") {
  id: UUID! @default(expr: "uuidV4()")
  mission: Mission!
  criterionName: String!
  description: String
  maxPoints: Float!
  order: Int! # FIXED: Ordering
}

type MissionSubmission @table(name: "mission_submissions") {
  id: UUID! @default(expr: "uuidV4()")
  mission: Mission!
  student: User!
  grader: User
  fileUrl: String!
  feedback: String
  status: SubmissionStatus! @default(expr: "'PENDING'") # FIXED: State tracking
  attemptNumber: Int! @default(expr: "1") # FIXED: Version tracking
  submittedAt: Timestamp! @default(expr: "request.time") # FIXED: Required
  updatedAt: Timestamp! @default(expr: "request.time")
}

type MissionSubmissionScore @table(name: "mission_submission_scores", key: ["submission", "criterion"]) {
  submission: MissionSubmission!
  criterion: RubricCriterion!
  score: Float! # FIXED: Relational scoring replacing the `Any` JSON block
}

# ==========================================
# TRACKING, ENGAGEMENT & SESSIONS
# ==========================================
type Enrollment @table(name: "enrollments") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  targetType: EnrollmentTarget! # FIXED: Polymorphic discriminator
  course: Course 
  mission: Mission 
  status: EnrollmentStatus!
  enrolledAt: Timestamp! @default(expr: "request.time")
  completedAt: Timestamp
}

type LectureProgress @table(name: "lecture_progress", key: ["user", "lecture"]) {
  user: User!
  lecture: CourseLecture!
  lastWatchedSecond: Int!
  completedAt: Timestamp
}

type QuizAttempt @table(name: "quiz_attempts") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  quiz: CourseQuiz!
  score: Float      # FIXED: Track outcome
  passed: Boolean   # FIXED: Track outcome
  startedAt: Timestamp! @default(expr: "request.time")
  completedAt: Timestamp
}

type QuizAttemptAnswer @table(name: "quiz_attempt_answers", key: ["attempt", "question"]) {
  attempt: QuizAttempt!
  question: QuizQuestion!
  selectedOption: QuizOption! # FIXED: Stable relational mapping
}

type Session @table(name: "sessions") {
  id: UUID! @default(expr: "uuidV4()")
  course: Course!
  title: String!
  hostUser: User      # FIXED: Instructor leading the session
  capacity: Int       # FIXED: Max seats
  startTime: Timestamp!
  endTime: Timestamp!
  type: SessionType!
  locationOrUrl: String!
  qrCodeHash: String
  deletedAt: Timestamp
}

type Attendance @table(name: "attendance") {
  id: UUID! @default(expr: "uuidV4()")
  student: User!
  session: Session!
  status: AttendanceStatus!
  method: AttendanceMethod!
  timestamp: Timestamp! @default(expr: "request.time")
}

# ==========================================
# CERTIFICATES
# ==========================================
type Certificate @table(name: "certificates") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  targetType: CertificateTarget! # FIXED: Polymorphic discriminator
  course: Course
  mission: Mission
  issuedAt: Timestamp! @default(expr: "request.time")
  expiresAt: Timestamp           # FIXED: Compliance/Renewal tracing
  verificationHash: String! @unique
  assetUrl: String!
}

# ==========================================
# FINANCIALS & SUBSCRIPTIONS
# ==========================================
type SubscriptionTier @table(name: "subscription_tiers") {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @unique
  price: Int! 
  billingCycle: BillingCycle! # FIXED: Enum
  features: [String!]!        # FIXED: Non-null items
  isActive: Boolean! @default(expr: "true") # FIXED: Safe deprecation
}

type Payment @table(name: "payments") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  gateway: PaymentGateway!
  status: PaymentStatus!
  amount: Int!               # FIXED: Missing total amount
  currency: String! @default(expr: "'EGP'") # FIXED: Currency code
  referenceId: String! @unique
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type UserSubscription @table(name: "user_subscriptions") {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  tier: SubscriptionTier!
  payment: Payment           # FIXED: Audit trace to payment
  status: SubscriptionStatus!
  startDate: Timestamp!
  endDate: Timestamp!
  autoRenew: Boolean!
  cancelledAt: Timestamp     # FIXED: Churn metrics
  cancelReason: String       # FIXED: Churn metrics
}

type PaymentItem @table(name: "payment_items") {
  id: UUID! @default(expr: "uuidV4()")
  payment: Payment!
  targetType: PaymentItemTarget! # FIXED: Polymorphic discriminator
  course: Course
  mission: Mission
  subscriptionTier: SubscriptionTier 
  priceAtPurchase: Int! 
}