version: '3.9'

# =============================================================
#  OptimaTech LMS — Local Development Environment
#  تشغيل: docker compose up -d
# =============================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: optimatech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-optimatech}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-optimatech_dev}
      POSTGRES_DB: ${DB_NAME:-optimatech_lms}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-optimatech}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: optimatech_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_pass}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_network

  # ── NestJS API ───────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: optimatech_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-optimatech}
      DB_PASSWORD: ${DB_PASSWORD:-optimatech_dev}
      DB_NAME: ${DB_NAME:-optimatech_lms}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_prod}
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./api/src:/app/src   # Hot reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_network

  # ── Next.js Web ──────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: optimatech_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-nextauth_secret_change_in_prod}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${FIREBASE_APP_ID}
    volumes:
      - ./web/src:/app/src   # Hot reload
    depends_on:
      - api
    networks:
      - lms_network

  # ── pgAdmin (Database GUI) ───────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: optimatech_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@optimatech.io
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_dev}
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - lms_network
    profiles:
      - tools    # تشغيل بـ: docker compose --profile tools up -d

  # ── Redis Commander (Redis GUI) ──────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: optimatech_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis_dev_pass}
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - lms_network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:

networks:
  lms_network:
    driver: bridge
